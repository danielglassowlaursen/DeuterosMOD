[workspace]
resolver = "3"
members = ["crates/deuteros-core", "crates/deuteros-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
deuteros-core = { path = "crates/deuteros-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bevy is slow unoptimised; optimise dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Size-oriented profile for the browser build (see scripts/build-web.sh).
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
