name: Rust

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Data file matches the extractor
        run: python3 tools/extract_coredata.py && git diff --exit-code crates/nullnet-core/data
      - run: cargo clippy -p nullnet-core -p nullnet-sim -p nullnet-server --all-targets -- -D warnings
      - run: cargo test -p nullnet-core -p nullnet-server
      - name: Bot game (fails if a bot gives an order the rules refuse)
        run: cargo run --release -p nullnet-sim -- --crews 4 --days 5000

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p nullnet-client --target wasm32-unknown-unknown -- -D warnings
      - name: Install wasm-bindgen-cli matching Cargo.lock
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --locked --version "$version"
      - name: Install wasm-opt
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - run: scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nullnet-web
          path: dist
