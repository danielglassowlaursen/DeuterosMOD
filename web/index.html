<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NullNet</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas#nullnet { display: block; width: 100%; height: 100%; outline: none; }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #9fb4e8; font: 14px/1.4 ui-monospace, monospace; letter-spacing: 0.2em;
    }
  </style>
</head>
<body>
  <div id="loading">CONNECTING TO NULLNET…</div>
  <canvas id="nullnet"></canvas>
  <script type="module">
    import init from "./nullnet-client.js";
    const loading = document.getElementById("loading");
    init().then(
      () => loading.remove(),
      (error) => {
        // Older winit versions leave the event loop by throwing this on purpose.
        if (String(error).includes("Using exceptions for control flow")) {
          loading.remove();
          return;
        }
        loading.textContent = "FAILED TO START: " + error;
        throw error;
      },
    );
  </script>
</body>
</html>
