[package]
name = "nullnet-server"
description = "Runs NullNet games: invites, orders, turn resolution and the web client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
nullnet-api.workspace = true
nullnet-core.workspace = true
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["fs"] }
ureq = "3.4.2"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
