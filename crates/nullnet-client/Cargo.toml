[package]
name = "nullnet-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
nullnet-core.workspace = true
bevy = { version = "0.19.1", default-features = false, features = ["2d", "ui", "bevy_audio", "wav"] }
ehttp = { version = "0.7.1", features = ["json"] }
nullnet-api.workspace = true
serde = { workspace = true, features = ["derive"] }

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "EventTarget",
    "HtmlAudioElement",
    "HtmlMediaElement",
    "SpeechSynthesis",
    "SpeechSynthesisUtterance",
    "Window",
    "Location",
    "Document",
    "Storage",
    "Notification",
    "NotificationOptions",
    "NotificationPermission",
] }
